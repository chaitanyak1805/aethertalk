<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating... | AI Chatbot</title>
    <!-- Use Outfit Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0b0f19;
            --text: #f3f4f6;
            --primary: #6366f1;
            --surface: #1e293b;
        }
        body {
            background-color: var(--background);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 600;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            margin: 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h2>Authenticating</h2>
        <p>Syncing your secure credentials. Please wait...</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Parse tokens from URL hash fragment (implicit OAuth redirection)
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            
            const accessToken = params.get("access_token");
            const refreshToken = params.get("refresh_token");
            
            if (accessToken) {
                // POST to authentication sync session route
                fetch("/api/auth/session-sync", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = "/chat";
                    } else {
                        alert("Session synchronization failed: " + (data.error || "Unknown error"));
                        window.location.href = "/login";
                    }
                })
                .catch(error => {
                    console.error("Error synchronizing session:", error);
                    window.location.href = "/login";
                });
            } else {
                // If there's session code parameters (handled via PKCE) or normal issues, fallback to login
                setTimeout(() => {
                    window.location.href = "/login";
                }, 1500);
            }
        });
    </script>
</body>
</html>
