<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AetherTalk AI</title>
    <!-- Outfit & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
</head>

<body class="theme-dark auth-page">
    <div class="auth-card-container">
        <div class="auth-logo">
            <a href="/"><i class="fa-solid fa-wand-magic-sparkles"></i> AetherTalk</a>
        </div>

        <div class="auth-card">
            <h2>Reset Password</h2>
            <p class="subtitle">Enter your email to receive recovery instructions</p>

            <div id="alert-container"></div>

            <form id="forgot-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@domain.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="btn-submit">
                    <span>Send Reset Email</span>
                    <div class="btn-spinner hidden"></div>
                </button>
            </form>

            <p class="auth-footer">
                Back to <a href="/login">Log in</a>
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>

</html>
