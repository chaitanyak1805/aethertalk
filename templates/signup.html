<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AetherTalk AI</title>
    <!-- Outfit & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
</head>

<body class="theme-dark auth-page">
    <div class="auth-card-container">
        <div class="auth-logo">
            <a href="/"><i class="fa-solid fa-wand-magic-sparkles"></i> AetherTalk</a>
        </div>

        <div class="auth-card">
            <h2>Get Started</h2>
            <p class="subtitle">Create a free secure profile to save discussions</p>

            <div id="alert-container"></div>

            <form id="signup-form">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="fullname" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@domain.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Min. 8 characters" required minlength="8">
                        <button type="button" class="toggle-password" tabindex="-1"><i
                                class="fa-regular fa-eye"></i></button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-check"></i>
                        <input type="password" id="confirm-password" placeholder="Confirm password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="btn-submit">
                    <span>Create Account</span>
                    <div class="btn-spinner hidden"></div>
                </button>
            </form>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <button type="button" class="btn btn-outline btn-block btn-google" id="btn-google">
                <i class="fa-brands fa-google google-icon"></i> Continue with Google
            </button>

            <p class="auth-footer">
                Already have an account? <a href="/login">Log in</a>
            </p>
        </div>
    </div>

    <!-- Inject public Supabase credentials for client-side Google OAuth trigger helper -->
    <script>
        window.SUPABASE_URL = "{{ env_supabase_url or '' }}";
        window.SUPABASE_KEY = "{{ env_supabase_key or '' }}";
    </script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>

</html>
